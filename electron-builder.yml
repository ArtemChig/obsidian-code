# electron-builder config (owner: platform). Build with: npm run dist  (electron-vite build && electron-builder --win --publish never)
# Release (build + publish to GitHub): npm run release -- patch|minor|major  (scripts/release.mjs, RELEASING.md)
appId: com.obsidian.code
productName: Obsidian Code
copyright: Copyright © 2026 Obsidian Code

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - resources/**/*
  - "!resources/icons/*.py"
  - "!**/*.map"
  - "!**/{.eslintrc*,.prettierrc*,tsconfig*.json,*.tsbuildinfo}"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,README,changelog.md}"
  - "!**/node_modules/*/{test,__tests__,tests,example,examples}/**"

# Native binaries and files read via fs at runtime must live outside the asar archive:
# ripgrep's rg.exe (spawned by the Grep tool), the Claude Code binary the Agent SDK ships per platform
# (@anthropic-ai/claude-agent-sdk-win32-x64/claude.exe, spawned by the claude-code engine; src/core/engine/env.ts maps
# app.asar → app.asar.unpacked) and resources/** (bootstrap script, icons; the main process points
# OBSIDIAN_RESOURCES_DIR at app.asar.unpacked/resources when packaged).
asarUnpack:
  - node_modules/@vscode/ripgrep*/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  - resources/**

extraResources:
  - from: resources/server
    to: server
    filter:
      - "**/*"

# Auto-update feed (src/main/updater.ts). `npm run release` uploads the NSIS installer, its .blockmap and latest.yml to a
# GitHub release in this PRIVATE repo; the installed app reads them with a token (saved secret or `gh auth token`).
# Builds also write resources/app-update.yml from this block. See RELEASING.md.
publish:
  provider: github
  owner: ArtemChig
  repo: obsidian-code
  private: true
  releaseType: release

win:
  icon: resources/icons/icon.ico
  # The builds are not code-signed. With this off, app-update.yml gets no `publisherName`, so electron-updater skips the
  # Authenticode check of downloaded installers (it would reject every unsigned update). Downloads are still verified
  # against the sha512 in latest.yml. Turn it back on (delete this line) once the app is signed.
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Obsidian Code
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  deleteAppDataOnUninstall: false
  # <installer>.exe.blockmap next to the installer (and latest.yml): what electron-updater needs.
  differentialPackage: true
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

npmRebuild: false
